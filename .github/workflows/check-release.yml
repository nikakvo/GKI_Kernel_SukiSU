name: Check Release

# The same check as ./check-release.sh in WSL, for people who build on
# GitHub (forks included): is there a newer SukiSU-Ultra / susfs4ksu /
# AmneziaWG commit, does the susfs KernelSU patch still fit it (applied
# for real, with the pipeline's own recovery code), and what to put into
# "Kernel Build" to build it.
#
# It only reads and reports - it never changes config.py, never commits
# and never starts a build. The answer lands in the run's Summary page
# (Actions -> the run -> Summary). The run is red when the verdict is
# STOP: then do not build the new commits, the pins in config.py (empty
# fields in "Kernel Build") are still the last working build.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'susfs4ksu branch to check (android13-5.15 is the one that is built and tested on a real phone)'
        required: true
        type: choice
        options:
          - gki-android13-5.15
          - gki-android14-6.1
          - gki-android15-6.6
        default: gki-android13-5.15
      susfs:
        description: 'Optional: test this susfs4ksu commit instead of the branch HEAD (same as ./check-release.sh --susfs <commit>). Leave empty normally.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check-release:
    name: Check release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Run check-release.sh
        id: check
        env:
          BRANCH: ${{ github.event.inputs.branch }}
          SUSFS: ${{ github.event.inputs.susfs }}
        run: |
          ARGS=(--branch "$BRANCH" --cache "$RUNNER_TEMP/gki-check" --no-ask)
          [ -n "$SUSFS" ] && ARGS+=(--susfs "$SUSFS")
          set +e
          bash ./check-release.sh "${ARGS[@]}" </dev/null 2>&1 | tee "$RUNNER_TEMP/check-release.txt"
          RC=${PIPESTATUS[0]}
          set -e
          echo "rc=$RC" >> "$GITHUB_OUTPUT"

      - name: Write summary
        env:
          RC: ${{ steps.check.outputs.rc }}
          BRANCH: ${{ github.event.inputs.branch }}
        run: |
          python3 - "$RUNNER_TEMP/check-release.txt" >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import os, re, sys

          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          rc = os.environ.get("RC", "1")
          branch = os.environ.get("BRANCH", "gki-android13-5.15")
          android, kver = branch[len("gki-"):].split("-", 1)

          # The verdict is the first OK/STOP line under "=== What to do ===".
          todo = text.split("=== What to do ===", 1)[-1]
          verdict = next((l.strip() for l in todo.splitlines()
                          if l.strip().startswith(("OK", "STOP"))), "")
          verdict = re.sub(r"^(OK|STOP)\s+", "", verdict)

          # The first ./build-kernel.sh command (with its continuation
          # lines) is the one to build; turn its flags into Kernel Build
          # fields.
          m = re.search(r"\./build-kernel\.sh((?:[^\n]*\\\n)*[^\n]*)", todo)
          flags = {}
          if m:
              words = m.group(1).replace("\\\n", " ").split()
              i = 0
              while i < len(words):
                  w = words[i]
                  if w.startswith("--") and i + 1 < len(words) and not words[i + 1].startswith("--"):
                      flags[w] = words[i + 1]
                      i += 2
                  else:
                      flags[w] = ""
                      i += 1

          print("## Check Release")
          print()
          if rc == "0":
              print(f"**OK** - {verdict}")
          else:
              print(f"**STOP** - {verdict or 'do not build the new commits.'}")
              print()
              print("Leave the pin fields of **Kernel Build** empty: that builds the last "
                    "working combination from config.py.")
          print()

          if rc == "0" and flags:
              print("### What to put into Kernel Build")
              print()
              print("| Field | Value |")
              print("|---|---|")
              print(f"| Android Version | `{android}` |")
              print(f"| Kernel Version | `{kver}` |")
              if branch == "gki-android13-5.15":
                  print("| Sub Level Version / OS Patch Level | leave the defaults (or a newer sub_level from matrix.json) |")
              else:
                  print("| Sub Level Version / OS Patch Level | an enabled row from matrix.json |")
              print(f"| SukiSU-Ultra tag/branch/commit | `{flags.get('--ksu-commit', '')}` |")
              print(f"| Version number SukiSU reports | `{flags.get('--ksu-version-code', '')}` |")
              print(f"| susfs4ksu pin | `{flags.get('--susfs-commit', '')}` |")
              print()
              if "Nothing new since the last build" in text:
                  print("These are the pins already in config.py, so leaving the three pin "
                        "fields empty builds exactly the same.")
                  print()
              if "--amneziawg-commit" in flags:
                  print(f"Newer AmneziaWG fits too (`{flags['--amneziawg-commit']}`). "
                        "Kernel Build has no field for it (GitHub allows 25), so it builds "
                        "the AmneziaWG pin from config.py until that is moved.")
                  print()
              if "--kpm-legacy" in flags:
                  print("This SukiSU needs the old KPM patcher (`--kpm-legacy`), which Kernel "
                        "Build cannot do - build it locally with build-kernel.sh.")
                  print()
              print("The kernel and the manager must have the same version number: install "
                    "the SukiSU-Ultra manager CI build for that commit "
                    "([build-manager runs](https://github.com/SukiSU-Ultra/SukiSU-Ultra/actions/workflows/build-manager.yml)).")
              print()

          print("<details><summary>Full check-release.sh output</summary>")
          print()
          print("```")
          print(text.rstrip())
          print("```")
          print()
          print("</details>")
          EOF

      - name: Fail on STOP
        if: steps.check.outputs.rc != '0'
        run: |
          echo "::error::check-release.sh says STOP - see the Summary page."
          exit 1
